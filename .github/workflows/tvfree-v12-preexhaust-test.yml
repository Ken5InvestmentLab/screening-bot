name: TV-free V12 pre-exhaustion Tail rank TEST

on:
  workflow_dispatch:
  push:
    branches:
      - test/tvfree-screener-v1
    paths:
      - "tvfree_screener/RUN_V12"

permissions:
  contents: read
  actions: read

jobs:
  v12-preexhaust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/tvfree-screener-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pandas numpy
      - name: Find latest successful Tail cache run
        id: tailrun
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="$(gh run list             --repo "$GITHUB_REPOSITORY"             --workflow "tvfree-tail-cache.yml"             --branch "test/tvfree-screener-v1"             --event push             --status success             --limit 1             --json databaseId             --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Download causal Tail cache
        uses: actions/download-artifact@v5
        with:
          name: tvfree-v7-causal-tail-cache-2023-2025
          path: tail_cache
          github-token: ${{ github.token }}
          repository: Ken5InvestmentLab/screening-bot
          run-id: ${{ steps.tailrun.outputs.run_id }}
      - name: Run V12 Pre-Exhaustion research
        run: |
          python tvfree_screener/v12_preexhaust_research.py             --tail-cache tail_cache/v7_causal_tail_cache_2023_2025.csv             --outdir out
      - name: Upload V12 evidence
        uses: actions/upload-artifact@v4
        with:
          name: tvfree-v12-preexhaust-${{ github.run_id }}
          path: out/**
          if-no-files-found: error
          retention-days: 30
