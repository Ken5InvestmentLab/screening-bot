name: Cloud Reliability Regression

on:
  push:
    branches: [research/weak-early-beta]
    paths:
      - 'weak_early_beta/**'
      - 'scripts/windows/weak-early-beta-*.mjs'
      - 'scripts/windows/test-weak-early-beta-*.mjs'
      - 'scripts/windows/test-new-a-runner.mjs'
      - 'scripts/windows/*new-a-operational*.mjs'
      - 'scripts/windows/*new-a-evaluation-morning.cjs'
      - 'scripts/windows/new-a-lifecycle-notice-inputs.cjs'
      - 'scripts/windows/new-a-fundamental-stage.mjs'
      - 'scripts/windows/test-new-a-fundamental-stage.mjs'
      - 'weak-early-beta-gate/scripts/new-a-ui-source/engine/**'
      - 'scripts/windows/native-admission-continuation.mjs'
      - 'scripts/windows/test-native-admission-continuation.mjs'
      - 'weak-early-beta-gate/scripts/deploy-with-provider-recovery.mjs'
      - 'weak-early-beta-gate/package.json'
      - 'tests/test_weak_early_beta*.py'
      - 'tests/test_new_a_native_recovery.py'
      - 'tests/test_corporate_action_metadata.py'
      - 'tests/test_corporate_action_event_bounds.py'
      - 'tests/test_endpoint_holds.py'
      - 'tests/cloud_deploy_recovery.test.mjs'
      - '.github/workflows/weak-early-beta-reliability.yml'
      - '.github/workflows/weak-early-beta-report-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install isolated source-validation test runtime
        run: >-
          pip install numpy==2.5.3 pandas==2.3.3 scikit-learn==1.9.1 xgboost==3.4.1
          'requests>=2.32,<3' 'yfinance>=0.2.65,<1' 'openpyxl>=3.1,<4'
      - name: Reproduce provider wait, duplicate prevention and snapshot wording cases
        # The continuation suite imports the existing runner cases; run each once.
        run: >-
          node --test tests/cloud_deploy_recovery.test.mjs
          scripts/windows/test-weak-early-beta-point-in-time-post.mjs
          scripts/windows/test-weak-early-beta-daily-runner.mjs
          scripts/windows/test-weak-early-beta-run-journal.mjs
          scripts/windows/test-weak-early-beta-delayed-recovery.mjs
          scripts/windows/test-native-admission-continuation.mjs
          scripts/windows/test-new-a-operational-loader.mjs
          scripts/windows/test-new-a-evaluation-morning.cjs
          scripts/windows/test-new-a-fundamental-stage.mjs
      - name: Verify retained-response replay and corporate-action gates
        run: >-
          python -B -m unittest tests.test_weak_early_beta_acquisition
          tests.test_new_a_native_recovery tests.test_corporate_action_metadata
          tests.test_corporate_action_event_bounds
          tests.test_weak_early_beta_corporate_actions tests.test_weak_early_beta_model
          tests.test_weak_early_beta_network tests.test_weak_early_beta_delistings
          tests.test_weak_early_beta_source_corrections tests.test_weak_early_beta_reviewed_overlay
          tests.test_weak_early_beta_reviewed_repair_releases tests.test_weak_early_beta_retained_off_session_actions
          tests.test_weak_early_beta_provider_restorations tests.test_endpoint_holds
          tests.test_new_a_delayed_recovery tests.test_new_a_delayed_progress
          tests.test_new_a_continuing_acceptance tests.test_new_a_connection
          tests.test_new_a_continuing_transition tests.test_new_a_finite_completion tests.test_new_a_fundamentals
          tests.test_new_a_planned_notice_delivery tests.test_new_a_lifecycle_notice_inputs
          tests.test_new_a_execution_identity
          tests.test_new_a_native_admission_context tests.test_new_a_wrangler_import_progress
          tests.test_new_a_operational_admission tests.test_new_a_operational_integration
          tests.test_new_a_fixed_source_recovery
