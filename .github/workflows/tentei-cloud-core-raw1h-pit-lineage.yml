name: Tentei Cloud Core Raw1H PIT Lineage Audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/tentei-cloud-mtf
    paths:
      - 'research/tentei_cloud/RUN_CORE_RAW1H_PIT_LINEAGE'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/tentei-cloud-mtf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Audit Core raw1H PIT lineage
        run: |
          python research/tentei_cloud/audit_core_raw1h_pit_lineage.py             --outdir out
      - uses: actions/upload-artifact@v4
        with:
          name: tentei-cloud-core-raw1h-pit-lineage
          path: out/**
          if-no-files-found: error
          retention-days: 30
