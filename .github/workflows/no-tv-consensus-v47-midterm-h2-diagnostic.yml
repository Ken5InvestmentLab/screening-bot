name: Consensus V47 Midterm H2 Diagnostic

on:
  push:
    branches: [research/consensus-atr-regime-gate]
    paths: ["research/RUN_V47_MIDTERM_H2_DIAGNOSTIC"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen dependencies
        run: pip install pandas==2.3.3 numpy==2.5.3 requests==2.34.2 scikit-learn==1.9.1 scipy==1.18.1 pyarrow
      - name: Download frozen run80 daily
        uses: actions/download-artifact@v5
        with:
          name: tvfree-frozen-dataset-run80-preserved
          path: frozen
          github-token: ${{ github.token }}
          repository: Ken5InvestmentLab/screening-bot
          run-id: 34599959356
      - name: Download accepted PIT membership
        uses: actions/download-artifact@v5
        with:
          name: consensus-pit-universe-34771221050
          path: pit
          github-token: ${{ github.token }}
          repository: Ken5InvestmentLab/screening-bot
          run-id: 34771221050
      - name: Download authoritative V47 daily materialization
        uses: actions/download-artifact@v5
        with:
          name: consensus-v47-daily-34799835035
          path: daily
          github-token: ${{ github.token }}
          repository: Ken5InvestmentLab/screening-bot
          run-id: 34799835035
      - name: Download preserved immutable Yahoo raw seed
        uses: actions/download-artifact@v5
        with:
          pattern: tentei-cloud-1h-shard-*
          path: raw_seed
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: Ken5InvestmentLab/screening-bot
          run-id: 34592896202
      - name: Verify corrected pre-open H2 contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('research/CONSENSUS_V47_MIDTERM_H2_DIAGNOSTIC_SPEC_20260914.json').read_text())
          c=json.loads(Path('research/CONSENSUS_V47_MIDTERM_PRICE_BASIS_CORRECTION_20260915.json').read_text())
          assert s['label']=='MIDTERM_DIAGNOSTIC_NOT_PROMOTION_EVIDENCE'
          assert s['cost_round_trip']==0.0 and s['promotion_evidence'] is False
          assert s['h1_leader_fixed_before_h2_open']=='CAP1000_PIT'
          assert s['selection_restrictions']['open_only']=='CAP1000_PIT'
          assert s['selection_restrictions']['open_NOCAP_H2_under_corrected_basis'] is False
          assert c['correction_id']=='CONSENSUS_V47_MIDTERM_CORE24_PRICE_BASIS_CORRECTION_V1'
          assert c['holdout_consequence']['same_family_retune_allowed'] is False
          PY
      - name: Verify Core24 source pin and normalize price basis
        env:
          PYTHONPATH: research
        run: |
          python research/normalize_core24_raw1h_for_v47.py --input-dir raw_seed --all-splits daily/v47_all_split_events.csv --pin-json research/consensus_v47_core24_raw_pin.json --output-dir raw_diag
      - name: Prepare partial coverage receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h1=json.loads(Path('research/CONSENSUS_V47_MIDTERM_DIAGNOSTIC_SPEC_20260914.json').read_text())
          cov={'label':'MIDTERM_DIAGNOSTIC_NOT_PROMOTION_EVIDENCE','input_correction':'CONSENSUS_V47_MIDTERM_CORE24_PRICE_BASIS_CORRECTION_V1','shadow_accepted':True,'promotion_grade':False,'formal_raw_acceptance_pass':False,'strategy_returns_opened':False,'model_scores_opened':False,'raw_source_run_id':34592896202,'source_pin_verified':True,'coverage_caveat':'partial preserved Yahoo seed; deterministic OHLC price-basis normalization only; missing pairs remain missing; no interpolation or synthetic bars'}
          Path('v47_midterm_h2_coverage.json').write_text(json.dumps(cov,indent=2))
          PY
      - name: Materialize corrected partial PIT features
        env:
          PYTHONPATH: research
        run: |
          python research/no_tv_v47_clean_feature_materializer.py --frozen-daily frozen/tse_daily.csv --restored-daily daily/v47_restored_daily.csv --all-splits daily/v47_all_split_events.csv --daily-candidates daily/v47_daily_candidate_symbol_dates.csv --membership-events pit/jpx_membership_events.csv --raw-dir raw_diag --raw-coverage-receipt v47_midterm_h2_coverage.json --allow-survivor-shadow --output-dir research_artifacts/v47_midterm_h2_features
      - name: Open corrected frozen H1 leader CAP1000 PIT on H2 at cost 0 percent
        env:
          PYTHONPATH: research
        run: |
          python research/no_tv_v47_midterm_h2_diagnostic.py --arm CAP1000_PIT --dev-features research_artifacts/v47_midterm_h2_features/v47_cap1000_dev_features.parquet --validation-blind research_artifacts/v47_midterm_h2_features/v47_cap1000_validation_blind.parquet --frozen-daily frozen/tse_daily.csv --restored-daily daily/v47_restored_daily.csv --preopen-spec research/CONSENSUS_V47_MIDTERM_H2_DIAGNOSTIC_SPEC_20260914.json --output-dir research_artifacts/v47_midterm_h2_diagnostic
      - name: Copy evidence and hash outputs
        if: always()
        run: |
          mkdir -p research_artifacts/v47_midterm_h2_diagnostic
          cp research/CONSENSUS_V47_MIDTERM_H2_DIAGNOSTIC_SPEC_20260914.json research_artifacts/v47_midterm_h2_diagnostic/preopen_spec.json
          cp research/CONSENSUS_V47_MIDTERM_PRICE_BASIS_CORRECTION_20260915.json research_artifacts/v47_midterm_h2_diagnostic/price_basis_correction_spec.json
          cp research/consensus_v47_core24_raw_pin.json research_artifacts/v47_midterm_h2_diagnostic/core24_source_pin.json
          cp raw_diag/core24_v47_normalization_receipt.json research_artifacts/v47_midterm_h2_diagnostic/core24_normalization_receipt.json || true
          cp v47_midterm_h2_coverage.json research_artifacts/v47_midterm_h2_diagnostic/preopen_coverage.json || true
          cp research_artifacts/v47_midterm_h2_features/v47_clean_feature_materialization.json research_artifacts/v47_midterm_h2_diagnostic/feature_materialization.json || true
          cd research_artifacts/v47_midterm_h2_diagnostic && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consensus-v47-midterm-h2-diagnostic-${{ github.run_id }}
          path: research_artifacts/v47_midterm_h2_diagnostic/**
          if-no-files-found: warn
          retention-days: 90
