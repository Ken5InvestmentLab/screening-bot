name: Tentei Cloud Canonical Event Long Overlay

on:
  workflow_dispatch:
  push:
    branches:
      - research/tentei-cloud-mtf
    paths:
      - 'research/tentei_cloud/RUN_EVENT_LONG_OVERLAY'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/tentei-cloud-mtf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scikit-learn
      - name: Download latest successful extended 1H fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="$(gh run list             --repo "$GITHUB_REPOSITORY"             --workflow "tentei-cloud-1h-research.yml"             --branch "research/tentei-cloud-mtf"             --event push             --status success             --limit 1             --json databaseId             --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          echo "$RUN_ID" > latest_fetch_run_id.txt
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir downloaded
      - name: Fetch frozen canonical event stream by blob SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/$GITHUB_REPOSITORY/git/blobs/06bf7736cdedf16f6c50f4e4ba0d715394c31588"             --jq .content | tr -d '\n' | base64 -d > canonical_events.csv
          test -s canonical_events.csv
          head -1 canonical_events.csv
      - name: Audit event + long overlay consumers
        run: |
          python research/tentei_cloud/audit_event_long_overlay.py             --inputs 'downloaded/**/ohlcv_1h_shard_*.csv'             --events canonical_events.csv             --outdir out
      - name: Record source fetch run
        run: cp latest_fetch_run_id.txt out/latest_fetch_run_id.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tentei-cloud-event-long-overlay
          path: out/**
          if-no-files-found: error
          retention-days: 30
