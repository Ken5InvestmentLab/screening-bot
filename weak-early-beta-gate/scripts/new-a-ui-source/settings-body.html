<section class="panel cloud-settings" id="cloud-settings-page" aria-labelledby="cloud-settings-title"><h1 id="cloud-settings-title">設定</h1>
<div class="settings-tabs" role="tablist" aria-label="設定の項目"><button id="settings-tab-trial" role="tab" aria-selected="true" aria-controls="settings-trial" type="button">試算方法</button><button id="settings-tab-display" role="tab" aria-selected="false" aria-controls="settings-display" tabindex="-1" type="button">表示</button></div>
<div id="settings-trial" role="tabpanel" aria-labelledby="settings-tab-trial"><div id="new-a-trial-preset-field"><label class="filter-field"><span>試算プリセット</span><select id="new-a-trial-preset"><option value="defensive">守り：5営業日目寄り・1日新規3件</option><option value="balanced" selected>中間：5営業日目寄り・上限なし</option><option value="profit">利益優先：8営業日目寄り・1日新規3件</option><option value="custom">個別設定（従来の確定日）</option></select></label></div><div class="filters"><label class="filter-field"><span>初期資金（円）</span><input id="new-a-initial-cash" type="number" min="1" max="1000000000000" step="1" inputmode="numeric" value="10000000"></label><label class="filter-field"><span>同時保有上限（銘柄）</span><input id="new-a-max-positions" type="number" min="1" max="1000" step="1" inputmode="numeric" value="20"></label><label class="filter-field"><span>1注文の購入上限（円）</span><input id="new-a-per-order-cap" type="number" min="1" max="1000000000000" step="1" inputmode="numeric" value="500000"></label>
<label class="filter-field"><span>検出年</span><select id="cloud-year-scope"><option value="2023">2023年</option><option value="2024">2024年</option><option value="2025">2025年</option><option value="2026">2026年</option><option value="all">全期間</option></select></label>
<label class="filter-field"><span>検出日 終値の上限</span><select id="cloud-price-preset"><option value="1000" selected>1,000円以下</option><option value="2000">2,000円以下</option><option value="3000">3,000円以下</option><option value="5000">5,000円以下</option><option value="unlimited">上限なし</option><option value="custom">自由入力</option></select></label>
<label class="filter-field" id="cloud-price-custom-field" hidden><span>任意の上限（円・小数2桁まで）</span><input id="cloud-price-custom" type="number" step="0.01" min="0.01" inputmode="decimal" value="1000"></label>
<label class="filter-field"><span>確定日</span><select id="cloud-exit-endpoint"><option value="d5_close">5営業日後 終値</option><option value="d6_open" selected>寄付（既存6営業日目・新規5営業日目）</option><option value="a20_close">20営業日目 終値</option></select></label>
<label class="filter-field"><span>株数の配分</span><select id="cloud-allocation"><option value="all">両方式を比較</option><option value="unique">各銘柄を同じ株数で試算する</option><option value="stacked">一致した条件数に応じて株数を増やす</option></select></label>
<label class="filter-field"><span>基準となる株数</span><input id="cloud-base-shares" type="number" min="100" max="1000000" step="100" inputmode="numeric" value="100"></label>
<label class="filter-field"><span>売買手数料（片道％）</span><input id="cloud-cost-percent" type="number" min="0" max="10" step="0.01" inputmode="decimal" value="0"></label></div>
</div>
<div id="settings-display" role="tabpanel" aria-labelledby="settings-tab-display" hidden><div class="filters">
<label class="filter-field"><span>テーマ</span><select id="cloud-theme"><option value="light">ライト</option><option value="dark" selected>ダーク</option><option value="system">端末に合わせる</option></select></label>
<label class="filter-field"><span>文字サイズ</span><select id="cloud-font-size"><option value="small">小さめ</option><option value="standard" selected>標準</option><option value="large">大きめ</option></select></label>
<label class="filter-field"><span>一覧件数</span><select id="cloud-page-size"><option value="20">20件</option><option value="50">50件</option><option value="100">100件</option></select></label></div></div>
<div class="settings-actions"><p id="cloud-settings-status" role="status" aria-atomic="true" tabindex="-1"></p>
<button id="cloud-research-reset" class="settings-secondary" type="button">試算方法をリセット</button><button id="cloud-settings-cancel" class="settings-secondary" type="button">キャンセル</button><button disabled id="cloud-settings-save" class="settings-primary" type="button">設定を保存</button></div></section>
<section class="panel cloud-settings" id="new-a-notification-settings" aria-labelledby="new-a-notification-title" hidden>
<h2 id="new-a-notification-title">プッシュ通知</h2>
<p class="note">通知を受け取りたい端末で登録してください。</p>
<div id="new-a-notification-device"></div>
<button id="new-a-notification-register" class="settings-secondary" type="button" disabled>この端末を登録</button>
<fieldset id="new-a-notification-opt-in" class="new-a-notification-options" disabled>
<legend>受け取る通知</legend>
<label><input id="new-a-notify-detection" type="checkbox"> 新しい検出</label>
<label><input id="new-a-notify-reminder" type="checkbox"> 確定日の朝8時（日本時間）</label>
<p class="note">選んだ確定日の朝8時にお知らせします。その日の価格はまだ確定していません。</p>
</fieldset>
<p id="new-a-notification-status" role="status"></p>
<div class="settings-actions">
<button id="new-a-notification-retry" class="settings-secondary" type="button" hidden>再試行</button>
<button id="new-a-notification-save" class="settings-primary" type="button" disabled>通知設定を保存</button>
</div>
</section>
