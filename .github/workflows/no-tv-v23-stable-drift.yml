name: No-TV Tenchi V23 Stable Drift

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/no-tv-distillation
    paths:
      - research/no_tv_v23_stable_drift_audit.py
      - .github/workflows/no-tv-v23-stable-drift.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: experiment/no-tv-distillation
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install numpy==2.3.1 pandas==2.3.0 google-auth google-auth-httplib2 google-api-python-client
      - name: Write read-only Google credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json
      - name: Export production BOTTOM feature snapshots read-only
        env:
          PYTHONIOENCODING: utf-8
        run: python research/export_no_tv_teacher.py
      - name: Run Stable drift audit
        run: |
          python research/no_tv_v23_stable_drift_audit.py \
            --teacher research_artifacts/no_tv_teacher/teacher_bottom_confirmed.csv \
            --output-dir research_artifacts/v23_stable_drift
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: no-tv-tenchi-v23-stable-drift
          path: research_artifacts/v23_stable_drift/
          if-no-files-found: ignore
          retention-days: 14
