name: No-TV Tenchi V35 Live Prefilter

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/no-tv-distillation
    paths:
      - research/no_tv_v35_live_prefilter.py
      - .github/workflows/no-tv-v35-live-prefilter.yml

concurrency:
  group: no-tv-tenchi-v35-live-prefilter
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: experiment/no-tv-distillation
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pandas==2.3.0 requests==2.32.4 openpyxl xlrd
      - name: Compile
        run: python -m py_compile research/no_tv_v34_jpx_universe.py research/no_tv_v35_live_prefilter.py
      - name: Build full live prefilter without TradingView
        run: |
          python research/no_tv_v35_live_prefilter.py \
            --decision-date 2026-09-10 \
            --max-workers 24 \
            --output-dir research_artifacts/v35_live_prefilter
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: no-tv-tenchi-v35-live-prefilter
          path: research_artifacts/v35_live_prefilter/
          if-no-files-found: error
          retention-days: 14
