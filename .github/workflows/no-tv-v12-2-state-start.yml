name: No-TV Tenchi V12.2 State Start

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/no-tv-distillation
    paths:
      - research/no_tv_v12_2_state_start.py
      - .github/workflows/no-tv-v12-2-state-start.yml

concurrency:
  group: no-tv-tenchi-v12-2-state-start
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: experiment/no-tv-distillation
      - name: Clone exact public watchlist history
        run: git clone --quiet https://github.com/Ken5InvestmentLab/tv-watchlist-builder.git tv-watchlist-builder-history
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install numpy==2.3.1 pandas==2.3.0 requests==2.32.4 scikit-learn==1.7.2 google-auth google-auth-httplib2 google-api-python-client
      - name: Write read-only Google credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json
      - name: Export teacher read-only
        env:
          PYTHONIOENCODING: utf-8
        run: python research/export_full_bottom_history.py --output research_artifacts/no_tv_teacher/full_bottom_history.csv
      - name: Run state-start sensitivity
        run: |
          python research/no_tv_v12_2_state_start.py \
            --teacher research_artifacts/no_tv_teacher/full_bottom_history.csv \
            --watchlist-repo tv-watchlist-builder-history \
            --max-symbols 350 \
            --max-workers 20 \
            --output-dir research_artifacts/v12_2_state_start
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: no-tv-tenchi-v12-2-state-start
          path: research_artifacts/v12_2_state_start/
          if-no-files-found: ignore
          retention-days: 14
