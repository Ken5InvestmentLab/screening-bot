name: Consensus V44 Strict Contract Tests

on:
  push:
    branches:
      - research/consensus-atr-regime-gate
    paths:
      - "research/evaluate_consensus_v44_strict5.py"
      - "research/audit_consensus_v44_ties.py"
      - "research/test_consensus_v44_strict_contract.py"
      - ".github/workflows/consensus-v44-strict-contract-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal dependencies
        run: pip install pandas==3.0.5 numpy==2.5.3
      - name: Compile
        run: |
          python -m py_compile \
            research/evaluate_consensus_v44_strict5.py \
            research/audit_consensus_v44_ties.py \
            research/test_consensus_v44_strict_contract.py
      - name: Run contract tests
        run: PYTHONPATH=research python research/test_consensus_v44_strict_contract.py
