name: Consensus V47 Raw1H Coverage Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - research/consensus-atr-regime-gate
    paths:
      - "research/RUN_V47_RAW1H_COVERAGE"

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read source run ids
        id: meta
        shell: bash
        run: |
          DAILY="$(awk -F= '/^daily_run_id=/{print $2}' research/RUN_V47_RAW1H_COVERAGE | tr -d '[:space:]')"
          RAW="$(awk -F= '/^raw_run_id=/{print $2}' research/RUN_V47_RAW1H_COVERAGE | tr -d '[:space:]')"
          test -n "$DAILY" || { echo "missing daily_run_id" >&2; exit 1; }
          test -n "$RAW" || { echo "missing raw_run_id" >&2; exit 1; }
          echo "daily_run_id=$DAILY" >> "$GITHUB_OUTPUT"
          echo "raw_run_id=$RAW" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: pip install pandas==2.3.3 numpy==2.5.3
      - name: Download daily materialization
        uses: actions/download-artifact@v5
        with:
          name: consensus-v47-daily-${{ steps.meta.outputs.daily_run_id }}
          path: daily
          github-token: ${{ github.token }}
          repository: Ken5InvestmentLab/screening-bot
          run-id: ${{ steps.meta.outputs.daily_run_id }}
      - name: Download all raw1h shards
        uses: actions/download-artifact@v5
        with:
          pattern: consensus-v47-raw1h-${{ steps.meta.outputs.raw_run_id }}-shard-*
          path: raw
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: Ken5InvestmentLab/screening-bot
          run-id: ${{ steps.meta.outputs.raw_run_id }}
      - name: Run outcome-blind raw coverage acceptance
        run: |
          python research/verify_consensus_v47_raw1h_coverage.py             --daily-candidates daily/v47_daily_candidate_symbol_dates.csv             --restored-daily daily/v47_restored_daily.csv             --daily-receipt daily/v47_daily_materialization_receipt.json             --raw-dir raw             --output-dir research_artifacts/v47_raw1h_coverage
      - name: Hash evidence
        run: |
          cd research_artifacts/v47_raw1h_coverage
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0             | sort -z             | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consensus-v47-raw1h-coverage-${{ github.run_id }}
          path: research_artifacts/v47_raw1h_coverage/**
          if-no-files-found: warn
          retention-days: 90
