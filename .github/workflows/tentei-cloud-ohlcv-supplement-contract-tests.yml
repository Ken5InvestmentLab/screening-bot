name: Tentei Cloud OHLCV Supplement Contract Tests

on:
  push:
    branches:
      - research/tentei-cloud-mtf
    paths:
      - 'research/tentei_cloud/ohlcv_supplement.py'
      - 'research/tentei_cloud/missing_inventory_runner.py'
      - 'research/tentei_cloud/raw1h_artifact_manifest.py'
      - 'research/tentei_cloud/test_ohlcv_supplement.py'
      - 'research/tentei_cloud/test_missing_inventory.py'
      - 'research/tentei_cloud/test_missing_inventory_runner.py'
      - 'research/tentei_cloud/test_raw1h_artifact_manifest.py'
      - 'research/tentei_cloud/OHLCV_SUPPLEMENT_SOURCE_POLICY_20260915.json'
      - '.github/workflows/tentei-cloud-ohlcv-supplement-contract-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pandas
      - name: Run supplement contract tests
        working-directory: research/tentei_cloud
        run: python -m unittest discover -v -p 'test*.py'
