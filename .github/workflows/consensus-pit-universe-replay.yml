name: Consensus PIT Universe Replay

on:
  workflow_dispatch:
  push:
    branches:
      - research/consensus-atr-regime-gate
    paths:
      - "research/RUN_PIT_UNIVERSE_REPLAY"

permissions:
  contents: read
  actions: read

concurrency:
  group: consensus-pit-universe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Checkout exact run80 source
        uses: actions/checkout@v4
        with:
          ref: 5461eef6f35ea2cea2b4bc38ca7177c681681783
          path: run80_source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: pip install pandas==2.3.3 requests==2.34.2 lxml
      - name: Download preserved run80 source artifact
        uses: actions/download-artifact@v5
        with:
          name: tvfree-screener-test-34545440155
          path: run80_artifact
          github-token: ${{ github.token }}
          repository: Ken5InvestmentLab/screening-bot
          run-id: 34545440155
      - name: Verify exact source self-test
        run: |
          cd run80_source
          PYTHONPATH=tvfree_screener python tvfree_screener/point_in_time_universe_selftest.py
      - name: Replay official JPX membership history
        run: |
          cd run80_source
          python tvfree_screener/point_in_time_universe.py             --current-snapshot ../run80_artifact/jpx_universe_snapshot.csv             --start 2022-01-01             --anchor-date 2026-09-11
      - name: Validate acceptance receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("research_artifacts/pit_universe_replay/jpx_point_in_time_report.json")
          r = json.loads(p.read_text(encoding="utf-8"))
          v = r["validation"]
          assert v["unknown_market_rows"] == 0, v
          assert v["same_day_code_collisions"] == 0, v
          assert v["valid_for_membership_reconstruction"] is True, v
          print(json.dumps(r, ensure_ascii=False, indent=2))
          PY
      - name: Collect and hash evidence
        run: |
          cd research_artifacts/pit_universe_replay
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consensus-pit-universe-${{ github.run_id }}
          path: research_artifacts/pit_universe_replay/**
          if-no-files-found: warn
          retention-days: 90
