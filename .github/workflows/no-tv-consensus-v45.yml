name: No-TV Consensus V45 Full Context ATR

on:
  workflow_dispatch:
  push:
    branches:
      - research/consensus-atr-regime-gate
    paths:
      - "research/RUN_V45_FULL_CONTEXT_ATR"

permissions:
  contents: read
  actions: read

concurrency:
  group: consensus-v45-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install V43 receipt dependencies
        run: pip install pandas==3.0.5 numpy==2.5.3 requests==2.34.2 scikit-learn==1.9.1 scipy==1.18.1
      - name: Download preserved frozen daily dataset
        uses: actions/download-artifact@v5
        with:
          name: tvfree-frozen-dataset-run80-preserved
          path: frozen
          github-token: ${{ github.token }}
          repository: Ken5InvestmentLab/screening-bot
          run-id: 34599959356
      - name: Compile V45
        run: |
          python -m py_compile \
            research/no_tv_v10_standalone.py \
            research/no_tv_v11_independent_selector.py \
            research/no_tv_v11_1_risk_guard.py \
            research/no_tv_v13_official_daily.py \
            research/no_tv_v18_rank_rolling.py \
            research/no_tv_v29_purged_rolling.py \
            research/no_tv_v43_2025_uncapped.py \
            research/no_tv_v45_full_context_atr.py
      - name: Run outcome-free full-context ATR audit
        run: |
          PYTHONPATH=research python research/no_tv_v45_full_context_atr.py \
            --frozen-daily frozen/tse_daily.csv \
            --max-workers 16 \
            --output-dir research_artifacts/v45_full_context_atr
      - name: Hash V45 evidence
        if: always()
        run: |
          if [ -d research_artifacts/v45_full_context_atr ]; then
            find research_artifacts/v45_full_context_atr -type f -print0               | sort -z               | xargs -0 sha256sum               > research_artifacts/v45_full_context_atr/SHA256SUMS.txt
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: no-tv-consensus-v45-${{ github.run_id }}
          path: research_artifacts/v45_full_context_atr/**
          if-no-files-found: warn
          retention-days: 90
