name: TV-free V16 backward 2022 TEST

on:
  workflow_dispatch:
  push:
    branches:
      - test/tvfree-screener-v1
    paths:
      - "tvfree_screener/RUN_V16_2022"

permissions:
  contents: read
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/tvfree-screener-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install isolated test dependencies
        run: pip install -r tvfree_screener/requirements.txt
      - name: Compile runner
        run: python -m py_compile tvfree_screener/v16_backward_2022.py
      - name: Download preserved frozen run80 dataset
        uses: actions/download-artifact@v5
        with:
          name: tvfree-frozen-dataset-run80-preserved
          path: tvfree_screener/out
          github-token: ${{ github.token }}
          repository: Ken5InvestmentLab/screening-bot
          run-id: 34599959356
      - name: Run backward 2022 report
        run: >-
          python tvfree_screener/v16_backward_2022.py
          --cache tvfree_screener/out/tse_daily.csv
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: tvfree-v16-backward-2022-${{ github.run_id }}
          path: |
            tvfree_screener/out/v16_backward_2022_report.json
            tvfree_screener/out/v16_backward_2022_picks.csv
          if-no-files-found: error
          retention-days: 30
