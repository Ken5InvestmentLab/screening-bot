name: V20 Session-Impulse H1

on:
  push:
    branches:
      - research/tvfree-canonical-batch02
    paths:
      - 'research/RUN_V20_SESSION_IMPULSE_H1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v20-session-impulse-h1
  cancel-in-progress: false

jobs:
  universe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check pandas==3.0.5 numpy==2.5.3
      - name: Download frozen canonical daily
        uses: actions/download-artifact@v5
        with:
          name: tvfree-frozen-dataset-run80-preserved
          path: frozen
          github-token: ${{ github.token }}
          repository: Ken5InvestmentLab/screening-bot
          run-id: 34599959356
      - name: Build frozen H1 eligible universe
        run: |
          mkdir -p out
          python tvfree_screener/batch02/build_v20_h1_universe.py \
            --daily frozen/tse_daily.csv \
            --symbols-output out/v20_h1_symbols.txt \
            --receipt-output out/v20_h1_universe_receipt.json
          sha256sum out/v20_h1_symbols.txt > out/SHA256SUMS.txt
          git rev-parse HEAD > out/workflow_commit_sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v20-h1-universe-${{ github.run_id }}
          path: out/**
          if-no-files-found: error
          retention-days: 90

  fetch:
    needs: universe
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          name: v20-h1-universe-${{ github.run_id }}
          path: universe
      - name: Download frozen canonical daily for temporal coverage guard
        uses: actions/download-artifact@v5
        with:
          name: tvfree-frozen-dataset-run80-preserved
          path: frozen
          github-token: ${{ github.token }}
          repository: Ken5InvestmentLab/screening-bot
          run-id: 34599959356
      - name: Fetch frozen V20 H1 Yahoo 1H shard
        run: |
          mkdir -p raw
          python tvfree_screener/batch02/fetch_v20_h1_1h.py \
            --symbols universe/v20_h1_symbols.txt \
            --start 2025-01-06 \
            --end 2025-06-30 \
            --shard-index ${{ matrix.shard }} \
            --shard-count 4 \
            --output raw/ohlcv_1h_shard_${{ matrix.shard }}.csv \
            --failures raw/failures_${{ matrix.shard }}.json
          sha256sum raw/ohlcv_1h_shard_${{ matrix.shard }}.csv \
            raw/failures_${{ matrix.shard }}.json > raw/SHA256SUMS_${{ matrix.shard }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v20-h1-raw-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: raw/**
          if-no-files-found: error
          retention-days: 90

  coverage:
    needs: [universe, fetch]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check pandas==3.0.5 numpy==2.5.3
      - uses: actions/download-artifact@v5
        with:
          name: v20-h1-universe-${{ github.run_id }}
          path: universe
      - uses: actions/download-artifact@v5
        with:
          pattern: v20-h1-raw-shard-*-${{ github.run_id }}
          path: raw
          merge-multiple: true
      - name: Fail-closed raw coverage receipt
        run: |
          mkdir -p receipt
          python tvfree_screener/batch02/verify_v20_h1_raw_coverage.py \
            --symbols universe/v20_h1_symbols.txt \
            --daily frozen/tse_daily.csv \
            --raw-glob 'raw/ohlcv_1h_shard_*.csv' \
            --failures-glob 'raw/failures_*.json' \
            --output receipt/v20_h1_raw_coverage_receipt.json
          find raw -type f -print0 | sort -z | xargs -0 sha256sum > receipt/raw_SHA256SUMS.txt
          git rev-parse HEAD > receipt/workflow_commit_sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v20-h1-coverage-${{ github.run_id }}
          path: receipt/**
          if-no-files-found: error
          retention-days: 90

  evaluate_h1:
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check pandas==3.0.5 numpy==2.5.3 scikit-learn==1.9.1
      - name: Download frozen canonical daily
        uses: actions/download-artifact@v5
        with:
          name: tvfree-frozen-dataset-run80-preserved
          path: frozen
          github-token: ${{ github.token }}
          repository: Ken5InvestmentLab/screening-bot
          run-id: 34599959356
      - uses: actions/download-artifact@v5
        with:
          pattern: v20-h1-raw-shard-*-${{ github.run_id }}
          path: raw
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          name: v20-h1-universe-${{ github.run_id }}
          path: universe
      - uses: actions/download-artifact@v5
        with:
          name: v20-h1-coverage-${{ github.run_id }}
          path: receipt
      - name: Evaluate H1 only after accepted raw coverage
        run: |
          mkdir -p out/rows
          grep -q '"accepted": true' receipt/v20_h1_raw_coverage_receipt.json
          python tvfree_screener/batch02/eval_tentei_v20_session_impulse.py \
            --raw-glob 'raw/ohlcv_1h_shard_*.csv' \
            --daily frozen/tse_daily.csv \
            --period h1 \
            --output out/v20_session_impulse_h1.json \
            --rows-dir out/rows
          cp receipt/v20_h1_raw_coverage_receipt.json out/
          cp universe/v20_h1_universe_receipt.json out/
          sha256sum tvfree_screener/batch02/TENTEI_V20_SESSION_IMPULSE_CONTINUATION_SPEC.json \
            > out/spec_sha256.txt
          sha256sum tvfree_screener/batch02/eval_tentei_v20_session_impulse.py \
            > out/evaluator_sha256.txt
          find out -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > out/SHA256SUMS.txt
          git rev-parse HEAD > out/workflow_commit_sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v20-session-impulse-h1-${{ github.run_id }}
          path: out/**
          if-no-files-found: error
          retention-days: 90
