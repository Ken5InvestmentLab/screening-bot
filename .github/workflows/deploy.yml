name: Deploy Approved Logic

on:
  workflow_dispatch:  # Discord の /approve-update コマンドから呼び出し
    inputs:
      target:
        description: "承認するロジック"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - stable
          - sniper
          - mega
          - mega5_rebound
          - mega40_deep_reversal
          - mega40_wick_recovery

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      applied: ${{ steps.commit.outputs.applied }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy pandas google-auth google-auth-httplib2 google-api-python-client

      - name: Write credentials.json
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Write SSH key
        run: |
          echo '${{ secrets.SSH_PRIVATE_KEY }}' > /tmp/ssh_key
          chmod 600 /tmp/ssh_key

      - name: Apply pending logic
        env:
          PYTHONIOENCODING: utf-8
        run: python optimize_screener.py --apply-pending --target-logic "${{ inputs.target }}"

      - name: Commit applied logic
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for path in pending_logic.json pending_logic_sniper.json pending_logic_mega.json; do
            if [ -e "$path" ] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              git add -A "$path"
            fi
          done
          git add screener.js current_logic.json current_logic_sniper.json current_logic_mega.json index.js
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            echo "applied=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: apply approved screener logic [skip ci]"
            git pull --rebase origin main
            git push
            echo "applied=true" >> "$GITHUB_OUTPUT"
          fi

  refresh_report_after_approval:
    needs: deploy
    if: ${{ needs.deploy.outputs.applied == 'true' }}
    uses: ./.github/workflows/mega-validation-report.yml
    permissions:
      contents: write
    secrets: inherit
