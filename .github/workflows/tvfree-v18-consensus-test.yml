name: TV-free V18 consensus Watch Prime TEST

on:
  workflow_dispatch:
  push:
    branches:
      - test/tvfree-screener-v1
    paths:
      - "tvfree_screener/RUN_V18"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/tvfree-screener-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install isolated test dependencies
        run: pip install -r tvfree_screener/requirements.txt
      - name: Compile V18
        run: python -m py_compile tvfree_screener/v18_consensus_watch_prime.py
      - name: Download preserved frozen run80 dataset
        uses: actions/download-artifact@v5
        with:
          name: tvfree-frozen-dataset-run80-preserved
          path: frozen
          github-token: ${{ github.token }}
          repository: Ken5InvestmentLab/screening-bot
          run-id: 34599959356
      - name: Download causal Tail cache
        uses: actions/download-artifact@v5
        with:
          name: tvfree-v7-causal-tail-cache-2023-2025
          path: tail_cache
          github-token: ${{ github.token }}
          repository: Ken5InvestmentLab/screening-bot
          run-id: 34600083474
      - name: Run V18 consensus audit
        run: |
          python tvfree_screener/v18_consensus_watch_prime.py             --daily frozen/tse_daily.csv             --tail-cache tail_cache/v7_causal_tail_cache_2023_2025.csv
      - name: Upload V18 evidence
        uses: actions/upload-artifact@v4
        with:
          name: tvfree-v18-consensus-${{ github.run_id }}
          path: |
            tvfree_screener/out/v18_consensus_report.json
            tvfree_screener/out/v18_watch_2025.csv
            tvfree_screener/out/v18_prime_2025.csv
            tvfree_screener/out/v18_watch_2026.csv
            tvfree_screener/out/v18_prime_2026.csv
          if-no-files-found: error
          retention-days: 30
