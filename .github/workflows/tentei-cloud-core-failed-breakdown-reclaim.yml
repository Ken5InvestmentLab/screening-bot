name: Tentei Cloud Core Failed-Breakdown Reclaim

on:
  push:
    branches:
      - research/tentei-cloud-mtf
    paths:
      - "research/tentei_cloud/RUN_CORE_FAILED_BREAKDOWN_RECLAIM"
  workflow_dispatch:
    inputs:
      phase:
        description: "preconfirmation or locked_confirmation"
        required: true
        default: "preconfirmation"
        type: choice
        options:
          - preconfirmation
          - locked_confirmation

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check pandas==3.0.5 numpy==2.5.3 scikit-learn==1.9.1

      - name: Download frozen authorized extended 1H source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="34592896202"
          echo "$RUN_ID" > source_fetch_run_id.txt
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir downloaded

      - name: Evaluate frozen failed-breakdown reclaim family
        shell: bash
        run: |
          REQUESTED_PHASE="preconfirmation"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REQUESTED_PHASE="${{ inputs.phase }}"
          fi
          EXTRA=""
          if [ "$REQUESTED_PHASE" = "locked_confirmation" ]; then
            EXTRA="--open-locked"
          fi
          echo "$REQUESTED_PHASE" > requested_phase.txt
          python research/tentei_cloud/eval_core_failed_breakdown_reclaim.py \
            --inputs 'downloaded/**/ohlcv_1h_shard_*.csv' \
            --outdir out \
            $EXTRA

      - name: Record source and execution receipts
        run: |
          cp source_fetch_run_id.txt out/source_fetch_run_id.txt
          cp requested_phase.txt out/requested_phase.txt
          git rev-parse HEAD > out/evaluator_commit_sha.txt
          sha256sum research/tentei_cloud/CORE_FAILED_BREAKDOWN_RECLAIM_SPEC_20260914.json \
            > out/spec_sha256.txt
          sha256sum research/tentei_cloud/eval_core_failed_breakdown_reclaim.py \
            > out/evaluator_sha256.txt

      - name: Show result
        run: |
          cat out/failed_breakdown_reclaim_result.json
          cat out/failed_breakdown_reclaim_metrics.csv

      - uses: actions/upload-artifact@v4
        with:
          name: tentei-cloud-core-failed-breakdown-reclaim-${{ github.run_id }}
          path: out/**
          if-no-files-found: error
          retention-days: 90
