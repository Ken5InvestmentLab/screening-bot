name: No-TV Consensus V46 PIT Split Eligibility

on:
  workflow_dispatch:
  push:
    branches:
      - research/consensus-atr-regime-gate
    paths:
      - "research/RUN_V46_PIT_SPLIT_ELIGIBILITY"

permissions:
  contents: read
  actions: read

concurrency:
  group: consensus-v46-pit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install run80-source-compatible dependencies
        run: pip install pandas==2.3.3 numpy==2.5.3 requests==2.34.2 yfinance==0.2.66
      - name: Download preserved frozen daily dataset
        uses: actions/download-artifact@v5
        with:
          name: tvfree-frozen-dataset-run80-preserved
          path: frozen
          github-token: ${{ github.token }}
          repository: Ken5InvestmentLab/screening-bot
          run-id: 34599959356
      - name: Compile V46
        run: |
          python -m py_compile             research/no_tv_v46_pit_split_eligibility.py             research/test_no_tv_v46_pit_split_eligibility.py
      - name: Re-run synthetic contract
        run: python research/test_no_tv_v46_pit_split_eligibility.py
      - name: Run outcome-free PIT eligibility audit
        run: |
          python research/no_tv_v46_pit_split_eligibility.py             --frozen-daily frozen/tse_daily.csv             --output-dir research_artifacts/v46_pit_split_eligibility
      - name: Hash evidence
        run: |
          cd research_artifacts/v46_pit_split_eligibility
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0             | sort -z             | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: no-tv-consensus-v46-${{ github.run_id }}
          path: research_artifacts/v46_pit_split_eligibility/**
          if-no-files-found: warn
          retention-days: 90
