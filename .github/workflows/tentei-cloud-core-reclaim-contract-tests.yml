name: Tentei Cloud Core Reclaim Contract Tests

on:
  push:
    branches:
      - research/tentei-cloud-mtf
    paths:
      - 'research/tentei_cloud/CORE_FAILED_BREAKDOWN_RECLAIM_SPEC_20260914.json'
      - 'research/tentei_cloud/eval_core_failed_breakdown_reclaim.py'
      - 'research/tentei_cloud/test_core_failed_breakdown_reclaim.py'
      - '.github/workflows/tentei-cloud-core-reclaim-contract-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/tentei-cloud-mtf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Compile evaluator and tests
        run: |
          python -m py_compile \
            research/tentei_cloud/eval_core_failed_breakdown_reclaim.py \
            research/tentei_cloud/test_core_failed_breakdown_reclaim.py
      - name: Run frozen contract tests
        run: |
          python research/tentei_cloud/test_core_failed_breakdown_reclaim.py
