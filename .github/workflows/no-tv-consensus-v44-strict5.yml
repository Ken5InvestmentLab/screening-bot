name: No-TV Consensus V44 Strict5

on:
  workflow_dispatch:
  push:
    branches:
      - research/consensus-atr-regime-gate
    paths:
      - "research/RUN_V44_STRICT5"

permissions:
  contents: read
  actions: read

concurrency:
  group: consensus-v44-strict5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned analysis dependencies
        run: pip install pandas==3.0.5 numpy==2.5.3
      - name: Download authoritative V44 evidence
        uses: actions/download-artifact@v5
        with:
          name: no-tv-consensus-v44-34767664140
          path: v44
          github-token: ${{ github.token }}
          repository: Ken5InvestmentLab/screening-bot
          run-id: 34767664140
      - name: Download preserved frozen daily dataset
        uses: actions/download-artifact@v5
        with:
          name: tvfree-frozen-dataset-run80-preserved
          path: frozen
          github-token: ${{ github.token }}
          repository: Ken5InvestmentLab/screening-bot
          run-id: 34599959356
      - name: Verify authoritative V44 receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("v44/v44_consensus_topk_cooldown.json")
          if not p.exists():
              raise SystemExit("missing V44 result JSON")
          x=json.loads(p.read_text())
          r=x.get("baseline_reproduction_receipt",{})
          expected={
              "source_run":34617009116,
              "source_artifact_id":10274083399,
              "expected_n":67,
          }
          for k,v in expected.items():
              if r.get(k)!=v:
                  raise SystemExit(f"V44 receipt mismatch {k}: {r.get(k)} != {v}")
          if abs(float(r.get("expected_mean_pct"))-8.424148981560009)>1e-12:
              raise SystemExit("V44 expected mean receipt mismatch")
          if abs(float(r.get("expected_max_symbol_share"))-0.44776119402985076)>1e-15:
              raise SystemExit("V44 expected concentration receipt mismatch")
          if r.get("passed") is not True:
              raise SystemExit("V44 baseline reproduction did not pass")
          if x.get("nonchosen_validation_metrics_opened") is not False:
              raise SystemExit("V44 locked validation invariant failed")
          print("V44 authoritative receipt OK")
          PY
      - name: Compile strict evaluator
        run: python -m py_compile research/evaluate_consensus_v44_strict5.py
      - name: Evaluate strict 5BD policy
        run: |
          python research/evaluate_consensus_v44_strict5.py \
            --v44-json v44/v44_consensus_topk_cooldown.json \
            --dev-pool v44/v44_topk_pool_development.csv \
            --validation-blind-pool v44/v44_topk_pool_validation_blind.csv \
            --frozen-daily frozen/tse_daily.csv \
            --output-dir out/v44_strict5
      - name: Hash evidence
        if: always()
        run: |
          if [ -d out/v44_strict5 ]; then
            (cd out/v44_strict5 && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          fi
      - name: Upload strict evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: no-tv-consensus-v44-strict5-${{ github.run_id }}
          path: out/v44_strict5/**
          if-no-files-found: warn
          retention-days: 90
