name: TV-free V10 conditional kNN quality TEST

on:
  workflow_dispatch:
  push:
    branches:
      - test/tvfree-screener-v1
    paths:
      - "tvfree_screener/RUN_V10"

permissions:
  contents: read
  actions: read

jobs:
  v10-knn-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/tvfree-screener-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install isolated test dependencies
        run: pip install -r tvfree_screener/requirements.txt
      - name: Compile V10 research runner
        run: python -m py_compile tvfree_screener/v10_knn_quality_research.py
      - name: Download frozen run-80 artifact
        uses: actions/download-artifact@v5
        with:
          name: tvfree-screener-test-34545440155
          path: tvfree_screener/out
          github-token: ${{ github.token }}
          repository: Ken5InvestmentLab/screening-bot
          run-id: 34545440155
      - name: Run V10 conditional kNN Quality research
        run: >-
          python tvfree_screener/v10_knn_quality_research.py
          --cache tvfree_screener/out/tse_daily.csv
      - name: Upload V10 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tvfree-v10-knn-quality-${{ github.run_id }}
          path: |
            tvfree_screener/out/v10_knn_quality_report.json
            tvfree_screener/out/v10_knn_quality_locked_2026.csv
          if-no-files-found: warn
          retention-days: 7
