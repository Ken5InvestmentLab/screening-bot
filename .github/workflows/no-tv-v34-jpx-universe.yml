name: No-TV Tenchi V34 JPX Universe

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/no-tv-distillation
    paths:
      - research/no_tv_v34_jpx_universe.py
      - .github/workflows/no-tv-v34-jpx-universe.yml

concurrency:
  group: no-tv-tenchi-v34-jpx-universe
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: experiment/no-tv-distillation
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pandas==2.3.0 requests==2.32.4 openpyxl xlrd
      - name: Compile
        run: python -m py_compile research/no_tv_v34_jpx_universe.py
      - name: Build JPX ordinary-stock universe without TradingView
        run: python research/no_tv_v34_jpx_universe.py --output-dir research_artifacts/v34_jpx_universe
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: no-tv-tenchi-v34-jpx-universe
          path: research_artifacts/v34_jpx_universe/
          if-no-files-found: error
          retention-days: 14
