<div class="cloud-help-copy">
<p>ダッシュボードで監視・仮想保有、アナリティクスで損益・資金推移を確認できます。</p>
<h3>ラベルの見方</h3>
<dl class="cloud-help-labels">
<div><dt>監視開始・監視中</dt><dd>検出した銘柄の反発条件を確認中です。</dd></div>
<div><dt>監視終了</dt><dd>反発の確認、監視範囲からの離脱、期限などで終了しました。</dd></div>
<div><dt>買付候補</dt><dd>反発を確認し、翌営業日に仮想買付を判定します。</dd></div>
<div><dt>仮想保有開始・仮想保有終了</dt><dd>試算上の買付・決済です。履歴では「仮想保有中」「仮想決済済」と表示します。</dd></div>
<div><dt>データ保留</dt><dd>価格や取引状況などの確認が必要です。</dd></div>
<div><dt>試算対象</dt><dd>選択中の運用レベルの試算に含めた銘柄です。</dd></div>
</dl>
<p>表示は仮想運用の試算です。売買の推奨や将来の成果の保証は行いません。投資判断はご自身で行ってください。</p>
</div>
