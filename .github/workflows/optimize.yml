name: Daily Screener Optimization

on:
  workflow_dispatch:  # 手動実行ボタン（GASのrunDailyMaintenanceから自動起動）

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy pandas google-auth google-auth-httplib2 google-api-python-client

      - name: Write credentials.json
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Write SSH key
        run: |
          echo '${{ secrets.SSH_PRIVATE_KEY }}' > /tmp/ssh_key
          chmod 600 /tmp/ssh_key

      - name: Run optimizer (propose mode)
        env:
          PYTHONIOENCODING: utf-8
        run: python optimize_screener.py --propose

      - name: Commit pending logic (if candidate found)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f pending_logic.json ] && [ ! -f pending_logic_sniper.json ]; then
            echo "No pending logic to commit (no better candidate found)"
            exit 0
          fi
          [ -f pending_logic.json ] && git add pending_logic.json
          [ -f pending_logic_sniper.json ] && git add pending_logic_sniper.json
          if git diff --staged --quiet; then
            echo "No changes staged"
          else
            git commit -m "feat: propose screener logic update [pending approval]"
            git pull --rebase origin main
            git push
          fi
