name: Consensus V47 Raw1H Shard Contract Tests

on:
  push:
    branches:
      - research/consensus-atr-regime-gate
    paths:
      - "research/no_tv_v47_intraday_fetch_shard.py"
      - "research/test_no_tv_v47_intraday_fetch_shard.py"
      - ".github/workflows/consensus-v47-raw1h-contract-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal dependencies
        run: pip install pandas==2.3.3 requests==2.34.2
      - name: Compile
        run: |
          python -m py_compile             research/no_tv_v47_intraday_fetch_shard.py             research/test_no_tv_v47_intraday_fetch_shard.py
      - name: Run contract
        run: python research/test_no_tv_v47_intraday_fetch_shard.py
