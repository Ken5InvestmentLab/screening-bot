name: Build TV-free causal Tail research cache

on:
  workflow_dispatch:
  push:
    branches:
      - test/tvfree-screener-v1
    paths:
      - "tvfree_screener/RUN_TAIL_CACHE"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/tvfree-screener-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install isolated test dependencies
        run: pip install -r tvfree_screener/requirements.txt
      - name: Compile cache builder
        run: python -m py_compile tvfree_screener/build_tail_research_cache.py
      - name: Download frozen run-80 artifact
        uses: actions/download-artifact@v5
        with:
          name: tvfree-screener-test-34545440155
          path: tvfree_screener/out
          github-token: ${{ github.token }}
          repository: Ken5InvestmentLab/screening-bot
          run-id: 34545440155
      - name: Build causal Tail research cache
        run: >-
          python tvfree_screener/build_tail_research_cache.py
          --cache tvfree_screener/out/tse_daily.csv
      - name: Upload causal Tail research cache
        uses: actions/upload-artifact@v4
        with:
          name: tvfree-v7-causal-tail-cache-2023-2025
          path: |
            tvfree_screener/out/v7_causal_tail_cache_2023_2025.csv
            tvfree_screener/out/v7_causal_tail_cache_meta.json
          if-no-files-found: error
          retention-days: 90
