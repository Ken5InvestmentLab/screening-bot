name: Weak Early Beta Daily

on:
  workflow_dispatch:
    inputs:
      notify_discord:
        description: "Send new detections to the dedicated beta channel"
        required: false
        type: boolean
        default: false
      deploy_report:
        description: "Deploy the protected beta report Worker"
        required: false
        type: boolean
        default: false
  schedule:
    # 17:00 JST, after the TSE close. GitHub schedules run only from default branch.
    - cron: "0 8 * * 1-5"

concurrency:
  group: weak-early-beta-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  score-report-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONIOENCODING: utf-8
      WEAK_EARLY_BETA_SIGNAL_WEBHOOK_URL: ${{ secrets.WEAK_EARLY_BETA_SIGNAL_WEBHOOK_URL }}
      WEAK_EARLY_BETA_DISCORD_BOT_TOKEN: ${{ secrets.WEAK_EARLY_BETA_DISCORD_BOT_TOKEN }}
      WEAK_EARLY_BETA_REPORT_URL: ${{ vars.WEAK_EARLY_BETA_REPORT_URL }}
      DEPLOY_REPORT: ${{ (github.event_name == 'schedule' || inputs.deploy_report) && 'true' || 'false' }}
      NOTIFY_DISCORD: ${{ (github.event_name == 'schedule' || inputs.notify_discord) && 'true' || 'false' }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned causal scorer runtime
        run: >-
          pip install
          numpy==2.5.3 pandas==2.3.3 scikit-learn==1.9.1 xgboost==3.4.1
          requests>=2.32,<3 openpyxl>=3.1,<4 xlrd>=2.0,<3 lxml>=5,<7 yfinance>=0.2.65,<1

      - name: Run five-lane causal scorer once after close
        shell: bash
        run: |
          args=(daily --refresh-live --period 5y)
          if [ "$NOTIFY_DISCORD" = "true" ]; then
            if [ -z "$WEAK_EARLY_BETA_SIGNAL_WEBHOOK_URL" ]; then
              echo "WEAK_EARLY_BETA_SIGNAL_WEBHOOK_URL is missing; refusing a partial live-notification run."
              exit 1
            fi
            args+=(--notify)
          fi
          python -m weak_early_beta.cli "${args[@]}"

      - name: Verify beta package
        run: python -m unittest tests.test_weak_early_beta

      - name: Commit beta-only state and HTML
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weak_early_beta/state reports/weak_early_beta_*.html reports/weak-early-beta-interactions.js reports/weak-early-beta-theme-init.js
          if git diff --staged --quiet; then
            echo "Weak+Early beta is already current"
          else
            git commit -m "chore: update weak early beta daily state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Install beta gate dependencies
        if: env.DEPLOY_REPORT == 'true'
        working-directory: weak-early-beta-gate
        run: npm ci

      - name: Deploy separate protected beta report
        if: env.DEPLOY_REPORT == 'true'
        working-directory: weak-early-beta-gate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy

      - name: Upload causal receipt and queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weak-early-beta-${{ github.run_id }}
          path: |
            weak_early_beta/state/latest_run_receipt.json
            weak_early_beta/state/fundamental_queue.json
            weak_early_beta/state/metrics.csv
          if-no-files-found: warn
          retention-days: 30
