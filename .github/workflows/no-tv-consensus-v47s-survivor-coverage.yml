name: Consensus V47S Survivor Raw1H Coverage

on:
  workflow_dispatch:
  push:
    branches:
      - research/consensus-atr-regime-gate
    paths:
      - "research/RUN_V47S_SURVIVOR_RAW1H_COVERAGE"

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pandas==2.3.3 numpy==2.5.3
      - name: Read run ids
        id: meta
        run: |
          DAILY="$(awk -F= '/^daily_run_id=/{print $2}' research/RUN_V47S_SURVIVOR_RAW1H_COVERAGE | tr -d '[:space:]')"
          RAW="$(awk -F= '/^raw_run_id=/{print $2}' research/RUN_V47S_SURVIVOR_RAW1H_COVERAGE | tr -d '[:space:]')"
          test -n "$DAILY" && test -n "$RAW" || exit 1
          echo "daily=$DAILY" >> "$GITHUB_OUTPUT"
          echo "raw=$RAW" >> "$GITHUB_OUTPUT"
      - name: Download survivor daily source
        uses: actions/download-artifact@v5
        with:
          name: consensus-v47-daily-${{ steps.meta.outputs.daily }}
          path: daily
          github-token: ${{ github.token }}
          repository: Ken5InvestmentLab/screening-bot
          run-id: ${{ steps.meta.outputs.daily }}
      - name: Download survivor raw1h shards
        uses: actions/download-artifact@v5
        with:
          pattern: consensus-v47s-raw1h-${{ steps.meta.outputs.raw }}-shard-*
          path: raw
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: Ken5InvestmentLab/screening-bot
          run-id: ${{ steps.meta.outputs.raw }}
      - name: Download frozen daily
        uses: actions/download-artifact@v5
        with:
          name: tvfree-frozen-dataset-run80-preserved
          path: frozen
          github-token: ${{ github.token }}
          repository: Ken5InvestmentLab/screening-bot
          run-id: 34599959356
      - name: Verify shadow raw1h coverage
        env:
          PYTHONPATH: research
        run: |
          python research/verify_v47s_survivor_raw1h_coverage.py             --daily-candidates daily/v47_daily_candidate_symbol_dates.csv             --daily-receipt daily/v47_daily_materialization_receipt.json             --raw-dir raw             --frozen-daily frozen/tse_daily.csv             --output-dir research_artifacts/v47s_coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consensus-v47s-coverage-${{ github.run_id }}
          path: research_artifacts/v47s_coverage/**
          if-no-files-found: warn
          retention-days: 90
