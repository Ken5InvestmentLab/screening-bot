name: Deploy Approved Logic

on:
  workflow_dispatch:  # Discord の /approve-update コマンドから呼び出し

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy pandas google-auth google-auth-httplib2 google-api-python-client

      - name: Write credentials.json
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Write SSH key
        run: |
          echo '${{ secrets.SSH_PRIVATE_KEY }}' > /tmp/ssh_key
          chmod 600 /tmp/ssh_key

      - name: Apply pending logic
        env:
          PYTHONIOENCODING: utf-8
        run: python optimize_screener.py --apply-pending

      - name: Commit applied logic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm --cached pending_logic.json 2>/dev/null || true
          git rm --cached pending_logic_sniper.json 2>/dev/null || true
          git add screener.js current_logic.json current_logic_sniper.json index.js
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: apply approved screener logic [skip ci]"
            git pull --rebase origin main
            git push
          fi
