name: OSS validation tooling TEST

on:
  push:
    branches:
      - research/oss-validation-tooling
    paths:
      - "tvfree_screener/oss_validation.py"
      - "tvfree_screener/oss_validation_requirements.txt"
      - "tvfree_screener/optuna_discovery.py"
      - "tvfree_screener/edinet_oss_crosscheck.py"
      - "tvfree_screener/edinet_fundamental_collector.py"
      - "tvfree_screener/test_oss_validation.py"
      - "tvfree_screener/test_optuna_discovery.py"
      - "tvfree_screener/test_edinet_oss_crosscheck.py"
      - "research/OPTUNA_DISCOVERY_CONTRACT_20260914.json"
      - "research/EDINET_OSS_CROSSCHECK_CONTRACT_20260914.json"
      - ".github/workflows/oss-validation-tooling.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install base and OSS research dependencies
        run: |
          pip install -r tvfree_screener/requirements.txt
          pip install -r tvfree_screener/oss_validation_requirements.txt
          pip install "pytest>=8,<9"
      - name: Run isolated OSS research tests
        env:
          PYTHONPATH: .:tvfree_screener
        run: >-
          python -m pytest
          tvfree_screener/test_oss_validation.py
          tvfree_screener/test_optuna_discovery.py
          tvfree_screener/test_edinet_oss_crosscheck.py
          -q
      - name: Re-run custom EDINET synthetic self-check
        env:
          PYTHONPATH: .:tvfree_screener
        run: python tvfree_screener/edinet_fundamental_collector_selftest.py
