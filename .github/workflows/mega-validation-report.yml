name: Mega Validation Report

on:
  workflow_dispatch:
    inputs:
      alert_received_cutoff:
        description: "Optional local timestamp cutoff for displayed signals, e.g. 2026-06-22 14:36"
        required: false
        default: ""
      notify_discord:
        description: "Send the report-ready Discord notice"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      alert_received_cutoff:
        required: false
        type: string
        default: ""
      notify_discord:
        required: false
        type: boolean
        default: true
      logic_update_notice_payload_b64:
        required: false
        type: string
        default: ""

concurrency:
  group: mega-validation-report-${{ github.repository }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REPORT_GATE_DEPLOY_ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy pandas google-auth google-auth-httplib2 google-api-python-client

      - name: Write credentials.json
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Wait for premium snapshot completion
        if: ${{ inputs.notify_discord }}
        env:
          PREMIUM_SNAPSHOT_WAIT_SECONDS: "5400"
          PREMIUM_SNAPSHOT_POLL_SECONDS: "30"
          PYTHONIOENCODING: utf-8
        run: python wait_for_premium_snapshot.py

      - name: Snapshot current report
        run: |
          mkdir -p /tmp/mega-report-before
          cp reports/mega_validation_report_latest.md /tmp/mega-report-before/mega_validation_report_latest.md 2>/dev/null || true
          cp reports/mega_validation_report*.html /tmp/mega-report-before/ 2>/dev/null || true
          cp reports/report-interactions.js /tmp/mega-report-before/report-interactions.js 2>/dev/null || true
          cp reports/report-theme-init.js /tmp/mega-report-before/report-theme-init.js 2>/dev/null || true
          cp reports/mega_report_fundamental_cache.json /tmp/mega-report-before/mega_report_fundamental_cache.json 2>/dev/null || true

      - name: Generate report
        env:
          PYTHONIOENCODING: utf-8
          MEGA_REPORT_FINALIZE_SIGNAL_SNAPSHOTS: "1"
          MEGA_REPORT_FETCH_DISCORD_MESSAGES: ${{ (secrets.DISCORD_BOT_TOKEN != '' || secrets.DISCORD_TOKEN != '') && '1' || '0' }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN || secrets.DISCORD_TOKEN }}
          MEGA_REPORT_ALERT_RECEIVED_CUTOFF_INPUT: ${{ inputs.alert_received_cutoff }}
        run: |
          args=()
          if [ -n "$MEGA_REPORT_ALERT_RECEIVED_CUTOFF_INPUT" ]; then
            args+=(--alert-received-cutoff "$MEGA_REPORT_ALERT_RECEIVED_CUTOFF_INPUT")
          fi
          python generate_mega_validation_report.py "${args[@]}"

      - name: Ignore timestamp-only refresh
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          before_dir = Path("/tmp/mega-report-before")
          reports_dir = Path("reports")
          report_names = {
              "mega_validation_report_latest.md",
              "mega_report_fundamental_cache.json",
              "report-interactions.js",
              "report-theme-init.js",
          }
          report_names.update(path.name for path in reports_dir.glob("mega_validation_report*.html"))
          report_names.update(path.name for path in before_dir.glob("mega_validation_report*.html"))
          if (before_dir / "report-interactions.js").exists():
              report_names.add("report-interactions.js")
          if (before_dir / "report-theme-init.js").exists():
              report_names.add("report-theme-init.js")
          if (before_dir / "mega_report_fundamental_cache.json").exists():
              report_names.add("mega_report_fundamental_cache.json")

          def normalize(text):
              return re.sub(
                  r"\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} JST",
                  "<generated-at>",
                  text,
              )

          substantive_change = False
          generated_paths = []
          for name in sorted(report_names):
              current = reports_dir / name
              previous = before_dir / name
              if current.exists():
                  generated_paths.append(str(current))
              if not current.exists() and not previous.exists():
                  continue
              if current.exists() != previous.exists():
                  substantive_change = True
                  break
              if normalize(current.read_text(encoding="utf-8")) != normalize(previous.read_text(encoding="utf-8")):
                  substantive_change = True
                  break

          if substantive_change:
              print("Report content changed")
          else:
              subprocess.run(["git", "checkout", "--", *generated_paths], check=False)
              print("Only generated timestamp changed; restored tracked reports")
          PY

      - name: Commit report if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/mega_validation_report_latest.md reports/mega_report_fundamental_cache.json reports/mega_validation_report*.html reports/report-interactions.js reports/report-theme-init.js
          if git diff --staged --quiet; then
            echo "Mega validation report is already current"
          else
            git commit -m "chore: update mega validation report [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Install report gate dependencies
        if: ${{ env.REPORT_GATE_DEPLOY_ENABLED == 'true' }}
        working-directory: report-gate
        run: npm ci

      - name: Deploy protected report gate
        if: ${{ env.REPORT_GATE_DEPLOY_ENABLED == 'true' }}
        working-directory: report-gate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy

      - name: Deploy legacy protected report gate URL
        if: ${{ env.REPORT_GATE_DEPLOY_ENABLED == 'true' }}
        working-directory: report-gate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:legacy

      - name: Skip report-ready Discord notice when report gate deploy is disabled
        if: ${{ inputs.notify_discord && env.REPORT_GATE_DEPLOY_ENABLED != 'true' }}
        run: echo "Skipping report-ready Discord notice because report-gate deploy is disabled; linked Worker HTML was not updated."

      - name: Notify Discord that report HTML is ready
        if: ${{ inputs.notify_discord && env.REPORT_GATE_DEPLOY_ENABLED == 'true' }}
        env:
          DISCORD_REPORT_WEBHOOK_URL: ${{ secrets.DISCORD_REPORT_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL || secrets.DISCORD_WEBHOOK }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN || secrets.DISCORD_TOKEN }}
          REPORT_READY_NOTICE_DEDUP_SECONDS: "900"
        run: |
          echo "Waiting 150 seconds after report-gate deployment before sending the report-ready Discord notice"
          sleep 150
          python send_report_ready_notice.py

      - name: Notify Discord about approved logic update
        if: ${{ inputs.logic_update_notice_payload_b64 != '' }}
        env:
          LOGIC_UPDATE_NOTICE_PAYLOAD_B64: ${{ inputs.logic_update_notice_payload_b64 }}
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY'
          import base64
          import json
          import os

          from optimize_screener import DISCORD_WEBHOOK_URL, _post_discord_webhook

          encoded = os.environ.get("LOGIC_UPDATE_NOTICE_PAYLOAD_B64", "").strip()
          if not encoded:
              raise SystemExit(0)
          notices = json.loads(base64.b64decode(encoded).decode("utf-8"))
          if isinstance(notices, dict):
              notices = [notices]

          sent = 0
          for notice in notices:
              payload = notice.get("payload") if isinstance(notice, dict) else None
              if not payload:
                  continue
              label = notice.get("label") or "Discord approved logic update"
              if _post_discord_webhook(DISCORD_WEBHOOK_URL, payload, label=label):
                  sent += 1
          print(f"Sent {sent} approved logic update notice(s)")
          PY
