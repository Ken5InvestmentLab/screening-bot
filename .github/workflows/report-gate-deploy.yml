name: Protected Report Gate Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "report-gate/**"
      - "reports/mega_validation_report*.html"
      - "reports/report-interactions.js"
      - "reports/report-theme-init.js"
      - "reports/report-assets/*.png"
      - ".github/workflows/report-gate-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REPORT_GATE_DEPLOY_ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: report-gate/package-lock.json

      - name: Install dependencies
        working-directory: report-gate
        run: npm ci

      - name: Validate Worker
        working-directory: report-gate
        run: npm run check

      - name: Deploy protected report gate
        if: ${{ env.REPORT_GATE_DEPLOY_ENABLED == 'true' }}
        working-directory: report-gate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy

      - name: Deploy legacy protected report gate URL
        if: ${{ env.REPORT_GATE_DEPLOY_ENABLED == 'true' }}
        working-directory: report-gate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:legacy

      - name: Skip deploy notice
        if: ${{ env.REPORT_GATE_DEPLOY_ENABLED != 'true' }}
        run: echo "Cloudflare deploy skipped because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured."
