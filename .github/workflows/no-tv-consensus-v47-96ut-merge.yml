name: Consensus V47 96ut Daily Merge

on:
  workflow_dispatch:
  push:
    branches:
      - research/consensus-atr-regime-gate
    paths:
      - "research/RUN_V47_96UT_MERGE"

permissions:
  contents: read
  actions: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pandas==2.3.3
      - name: Read run ids
        id: meta
        run: |
          DAILY="$(awk -F= '/^daily_run_id=/{print $2}' research/RUN_V47_96UT_MERGE | tr -d '[:space:]')"
          RESTORE="$(awk -F= '/^restore_run_id=/{print $2}' research/RUN_V47_96UT_MERGE | tr -d '[:space:]')"
          test -n "$DAILY" && test -n "$RESTORE" || exit 1
          echo "daily=$DAILY" >> "$GITHUB_OUTPUT"
          echo "restore=$RESTORE" >> "$GITHUB_OUTPUT"
      - name: Download source daily receipt
        uses: actions/download-artifact@v5
        with:
          name: consensus-v47-daily-${{ steps.meta.outputs.daily }}
          path: daily
          github-token: ${{ github.token }}
          repository: Ken5InvestmentLab/screening-bot
          run-id: ${{ steps.meta.outputs.daily }}
      - name: Download 96ut shards
        uses: actions/download-artifact@v5
        with:
          pattern: consensus-v47-96ut-${{ steps.meta.outputs.restore }}-shard-*
          path: shards
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: Ken5InvestmentLab/screening-bot
          run-id: ${{ steps.meta.outputs.restore }}
      - name: Download PIT membership
        uses: actions/download-artifact@v5
        with:
          name: consensus-pit-universe-34771221050
          path: pit
          github-token: ${{ github.token }}
          repository: Ken5InvestmentLab/screening-bot
          run-id: 34771221050
      - name: Download frozen daily
        uses: actions/download-artifact@v5
        with:
          name: tvfree-frozen-dataset-run80-preserved
          path: frozen
          github-token: ${{ github.token }}
          repository: Ken5InvestmentLab/screening-bot
          run-id: 34599959356
      - name: Merge and audit
        run: |
          python research/merge_v47_96ut_daily.py             --raw-dir shards             --daily-receipt daily/v47_daily_materialization_receipt.json             --membership-events pit/jpx_membership_events.csv             --frozen-daily frozen/tse_daily.csv             --output-dir research_artifacts/v47_96ut_merge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consensus-v47-96ut-merge-${{ github.run_id }}
          path: research_artifacts/v47_96ut_merge/**
          if-no-files-found: warn
          retention-days: 90
