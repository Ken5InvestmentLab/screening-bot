name: TV-free V17 Prime tier audit TEST

on:
  workflow_dispatch:
  push:
    branches:
      - test/tvfree-screener-v1
    paths:
      - "tvfree_screener/RUN_V17"

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/tvfree-screener-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install isolated test dependencies
        run: pip install -r tvfree_screener/requirements.txt
      - name: Compile V17
        run: python -m py_compile tvfree_screener/v17_prime_tier_audit.py
      - name: Download preserved frozen run80 dataset
        uses: actions/download-artifact@v5
        with:
          name: tvfree-frozen-dataset-run80-preserved
          path: frozen
          github-token: ${{ github.token }}
          repository: Ken5InvestmentLab/screening-bot
          run-id: 34599959356
      - name: Download causal Tail cache
        uses: actions/download-artifact@v5
        with:
          name: tvfree-v7-causal-tail-cache-2023-2025
          path: tail_cache
          github-token: ${{ github.token }}
          repository: Ken5InvestmentLab/screening-bot
          run-id: 34600083474
      - name: Run V17 Prime audit
        run: |
          python tvfree_screener/v17_prime_tier_audit.py             --daily frozen/tse_daily.csv             --tail-cache tail_cache/v7_causal_tail_cache_2023_2025.csv             --outdir out
      - name: Upload V17 evidence
        uses: actions/upload-artifact@v4
        with:
          name: tvfree-v17-prime-${{ github.run_id }}
          path: out/**
          if-no-files-found: error
          retention-days: 30
