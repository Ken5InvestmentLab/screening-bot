name: Daily Screener Optimization

on:
  schedule:
    # UTC 10:30 = JST 19:30
    - cron: '30 10 * * *'
  workflow_dispatch:  # 手動実行ボタン

jobs:
  optimize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy pandas google-auth google-auth-httplib2 google-api-python-client

      - name: Write credentials.json
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Write SSH key
        run: |
          echo '${{ secrets.SSH_PRIVATE_KEY }}' > /tmp/ssh_key
          chmod 600 /tmp/ssh_key

      - name: Run optimizer
        env:
          PYTHONIOENCODING: utf-8
        run: python optimize_screener.py --yes

      - name: Commit updated current_logic.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add current_logic.json
          git diff --staged --quiet || git commit -m "chore: update current_logic.json [skip ci]"
          git push
