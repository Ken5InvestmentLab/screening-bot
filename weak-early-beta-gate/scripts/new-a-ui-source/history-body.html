<section class="panel" id="history" hidden><h2 id="new-a-history-heading" tabindex="-1">検出履歴</h2><button type="button" class="settings-secondary" id="new-a-history-open" aria-controls="new-a-history-content" aria-expanded="false">検出履歴を表示</button><p class="note" id="new-a-history-status" role="status" hidden></p><div class="history-details" id="new-a-history-content" hidden><div class="filters"><label class="filter-field"><span>銘柄</span><input id="symbol-filter" type="search" autocomplete="off" aria-label="証券コードまたは銘柄名で検索" placeholder="証券コード・銘柄名で検索"></label><label class="filter-field"><span>開始日</span><input id="history-date-from" type="date" aria-label="検出日の開始日"></label><label class="filter-field"><span>終了日</span><input id="history-date-to" type="date" aria-label="検出日の終了日"></label><label class="filter-field"><span>並び順</span><select id="history-sort"><option value="newest">新しい順</option><option value="oldest">古い順</option><option value="symbol">証券コード順</option></select></label><button class="clear-search" id="clear-search" type="button">検索をクリア</button><output class="result-count" id="search-result-count" aria-live="polite"></output></div><p id="new-a-history-empty" class="note" hidden>該当する銘柄がありません。</p><noscript><p class="note">検索機能を使うにはJavaScriptを有効にしてください。</p></noscript><div class="table-wrap history-table-wrap"><table id="detection-table"><thead><tr><th colspan="8"><div class="history-visible-grid"><div>検出日</div><div>銘柄</div><div>試算条件</div><div>状況</div><div>試算開始日・始値</div><div>5営業日後 終値<small>参照</small></div><div>6営業日後 始値<small>参照</small></div><div class="number">試算損益</div></div></th></tr></thead><tbody></tbody></table></div><div class="history-pagination"><button class="load-more" id="history-load-more" hidden type="button">次の20件を表示</button><button class="collapse-results" id="history-collapse" type="button" hidden>最初の20件に戻す</button></div></div></section>
