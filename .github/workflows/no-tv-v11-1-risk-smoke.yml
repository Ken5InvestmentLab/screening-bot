name: No-TV Tenchi V11.1 Risk Guard Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/no-tv-distillation
    paths:
      - research/no_tv_v11_1_risk_guard.py
      - .github/workflows/no-tv-v11-1-risk-smoke.yml

concurrency:
  group: no-tv-tenchi-v11-1-risk-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: experiment/no-tv-distillation
      - name: Clone exact public watchlist history
        run: git clone --quiet https://github.com/Ken5InvestmentLab/tv-watchlist-builder.git tv-watchlist-builder-history
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install numpy==2.3.1 pandas==2.3.0 requests==2.32.4 scikit-learn==1.7.2 google-auth google-auth-httplib2 google-api-python-client
      - name: Write read-only Google credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json
      - name: Export historical BOTTOM labels for evaluation only
        env:
          PYTHONIOENCODING: utf-8
        run: python research/export_full_bottom_history.py --output research_artifacts/no_tv_teacher/full_bottom_history.csv
      - name: Compile V11.1
        run: python -m py_compile research/no_tv_v10_standalone.py research/no_tv_stage2_selector.py research/no_tv_v11_independent_selector.py research/no_tv_v11_1_risk_guard.py
      - name: Run V11.1 risk guard smoke
        run: |
          python research/no_tv_v11_1_risk_guard.py \
            --teacher research_artifacts/no_tv_teacher/full_bottom_history.csv \
            --watchlist-repo tv-watchlist-builder-history \
            --max-symbols 350 \
            --max-workers 20 \
            --output-dir research_artifacts/v11_1_risk_smoke
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: no-tv-tenchi-v11-1-risk-smoke
          path: research_artifacts/v11_1_risk_smoke/
          if-no-files-found: ignore
          retention-days: 14
