name: Tentei Cloud 4H Model Stability

on:
  workflow_dispatch:
  push:
    branches:
      - research/tentei-cloud-mtf
    paths:
      - 'research/tentei_cloud/RUN_4H_STABILITY'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/tentei-cloud-mtf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scikit-learn
      - name: Download latest successful extended 1H fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "tentei-cloud-1h-research.yml" \
            --branch "research/tentei-cloud-mtf" \
            --event push \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir downloaded
      - name: Audit fixed 4H model across seeds
        run: |
          python research/tentei_cloud/audit_4h_model_stability.py \
            --inputs 'downloaded/**/ohlcv_1h_shard_*.csv' \
            --outdir out
      - uses: actions/upload-artifact@v4
        with:
          name: tentei-cloud-4h-stability
          path: out/**
          if-no-files-found: error
          retention-days: 14
