name: No-TV Tenchi V12 Pine Hybrid Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/no-tv-distillation
    paths:
      - research/no_tv_v12_pine_hybrid.py
      - .github/workflows/no-tv-v12-pine-hybrid-smoke.yml

concurrency:
  group: no-tv-tenchi-v12-pine-hybrid-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: experiment/no-tv-distillation
          fetch-depth: 1
      - name: Clone exact public watchlist history
        run: git clone --quiet https://github.com/Ken5InvestmentLab/tv-watchlist-builder.git tv-watchlist-builder-history
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install numpy==2.3.1 pandas==2.3.0 requests==2.32.4 scikit-learn==1.7.2 google-auth google-auth-httplib2 google-api-python-client
      - name: Write read-only Google credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json
      - name: Export full BOTTOM teacher history read-only
        env:
          PYTHONIOENCODING: utf-8
        run: python research/export_full_bottom_history.py --output research_artifacts/no_tv_teacher/full_bottom_history.csv
      - name: Validate teacher
        run: |
          python - <<'PY'
          import pandas as pd
          p='research_artifacts/no_tv_teacher/full_bottom_history.csv'
          d=pd.read_csv(p,dtype={'symbol_code':str})
          d['signal_date']=pd.to_datetime(d['signal_date']).dt.strftime('%Y-%m-%d')
          d['session']=pd.to_numeric(d['session'],errors='coerce').astype('Int64')
          assert len(d) >= 4041, len(d)
          assert d.signal_date.min()=='2026-03-05', d.signal_date.min()
          assert d.signal_date.max() <= '2026-09-10', d.signal_date.max()
          uniq=d[['symbol_code','signal_date','session']].drop_duplicates().shape[0]
          assert uniq == len(d), (uniq,len(d))
          print('teacher OK', len(d), d.signal_date.min(), d.signal_date.max())
          PY
      - name: Compile V12
        run: python -m py_compile research/no_tv_v10_standalone.py research/no_tv_v12_pine_hybrid.py
      - name: Run V12 Pine hybrid smoke
        run: |
          python research/no_tv_v12_pine_hybrid.py \
            --teacher research_artifacts/no_tv_teacher/full_bottom_history.csv \
            --watchlist-repo tv-watchlist-builder-history \
            --max-symbols 350 \
            --max-workers 20 \
            --output-dir research_artifacts/v12_pine_smoke
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: no-tv-tenchi-v12-pine-hybrid-smoke
          path: research_artifacts/v12_pine_smoke/
          if-no-files-found: ignore
          retention-days: 14
