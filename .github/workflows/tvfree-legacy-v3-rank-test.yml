name: TV-free Legacy V3 Rank Recovery TEST

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "tvfree_screener/v3_short_legacy_rank_recovery.py"
      - ".github/workflows/tvfree-legacy-v3-rank-test.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: tvfree-legacy-v3-rank-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recover-rank:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install isolated research dependencies
        run: pip install -r tvfree_screener/requirements.txt
      - name: Download frozen run-114 research artifact
        uses: actions/download-artifact@v5
        with:
          name: tvfree-screener-test-34554396869
          path: tvfree_screener/out
          github-token: ${{ github.token }}
          repository: Ken5InvestmentLab/screening-bot
          run-id: 34554396869
      - name: Restore event-quality relative ranking
        run: >-
          python tvfree_screener/v3_short_legacy_rank_recovery.py
          --cache tvfree_screener/out/tse_daily.csv
          --symbol-batch 200
      - name: Upload rank-recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tvfree-legacy-v3-rank-${{ github.run_id }}
          path: |
            tvfree_screener/out/v3_short_legacy_rank_recovery_report.json
            tvfree_screener/out/v3_short_legacy_rank_recovery_locked_2026.csv
          if-no-files-found: warn
          retention-days: 3
