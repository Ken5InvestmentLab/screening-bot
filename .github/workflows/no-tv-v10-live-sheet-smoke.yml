name: No-TV V10 Live Sheet Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/no-tv-distillation
    paths:
      - research/export_full_bottom_history.py
      - research/no_tv_v10_standalone.py
      - .github/workflows/no-tv-v10-live-sheet-smoke.yml

concurrency:
  group: no-tv-v10-live-sheet-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read

    steps:
      - name: Checkout isolated experiment branch
        uses: actions/checkout@v7
        with:
          ref: experiment/no-tv-distillation
          fetch-depth: 1

      - name: Clone exact public watchlist history
        run: git clone --quiet https://github.com/Ken5InvestmentLab/tv-watchlist-builder.git tv-watchlist-builder-history

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install numpy==2.3.1 pandas==2.3.0 requests==2.32.4 scikit-learn==1.7.2 openpyxl==3.1.5 google-auth google-auth-httplib2 google-api-python-client

      - name: Write read-only Google credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Export full BOTTOM teacher history from production Sheet read-only
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python research/export_full_bottom_history.py \
            --output research_artifacts/no_tv_teacher/full_bottom_history.csv

      - name: Validate teacher before model run
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          p=Path('research_artifacts/no_tv_teacher/full_bottom_history.csv')
          df=pd.read_csv(p,dtype={'symbol_code':str})
          audit={
            'rows':len(df),
            'symbols':int(df.symbol_code.nunique()),
            'date_min':str(df.signal_date.min()),
            'date_max':str(df.signal_date.max()),
            'duplicates':int(df.alert_id.duplicated().sum()),
            'monthly':df.groupby(df.signal_date.astype(str).str[:7]).size().astype(int).to_dict(),
            'sessions':df.session.value_counts().sort_index().astype(int).to_dict(),
          }
          print(json.dumps(audit,ensure_ascii=False,indent=2))
          assert len(df)>=3900
          assert df.alert_id.duplicated().sum()==0
          PY

      - name: Compile standalone V10
        run: python -m py_compile research/no_tv_v10_standalone.py

      - name: Run V10 exact-watchlist smoke
        run: |
          python research/no_tv_v10_standalone.py \
            --teacher research_artifacts/no_tv_teacher/full_bottom_history.csv \
            --watchlist-repo tv-watchlist-builder-history \
            --max-symbols 350 \
            --max-workers 20 \
            --output-dir research_artifacts/v10_smoke

      - name: Upload V10 smoke artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: no-tv-v10-live-sheet-smoke
          path: |
            research_artifacts/v10_smoke/
            research_artifacts/no_tv_teacher/full_bottom_history.summary.json
          if-no-files-found: ignore
          retention-days: 14
