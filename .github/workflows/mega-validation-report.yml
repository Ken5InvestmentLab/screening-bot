name: Mega Validation Report

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    # Fallback refresh at 21:00 JST on weekdays.
    - cron: "0 12 * * 1-5"

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REPORT_GATE_DEPLOY_ENABLED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy pandas google-auth google-auth-httplib2 google-api-python-client

      - name: Write credentials.json
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Snapshot current report
        run: |
          mkdir -p /tmp/mega-report-before
          cp reports/mega_validation_report_latest.md /tmp/mega-report-before/mega_validation_report_latest.md 2>/dev/null || true
          cp reports/mega_validation_report*.html /tmp/mega-report-before/ 2>/dev/null || true
          cp reports/report-interactions.js /tmp/mega-report-before/report-interactions.js 2>/dev/null || true

      - name: Generate report
        env:
          PYTHONIOENCODING: utf-8
          MEGA_REPORT_FETCH_DISCORD_MESSAGES: ${{ (secrets.DISCORD_BOT_TOKEN != '' || secrets.DISCORD_TOKEN != '') && '1' || '0' }}
          MEGA_REPORT_ALLOW_LINK_ONLY_FUNDAMENTALS: ${{ (secrets.DISCORD_BOT_TOKEN == '' && secrets.DISCORD_TOKEN == '') && '1' || '0' }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN || secrets.DISCORD_TOKEN }}
        run: python generate_mega_validation_report.py

      - name: Ignore timestamp-only refresh
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          before_dir = Path("/tmp/mega-report-before")
          reports_dir = Path("reports")
          report_names = {"mega_validation_report_latest.md", "report-interactions.js"}
          report_names.update(path.name for path in reports_dir.glob("mega_validation_report*.html"))
          report_names.update(path.name for path in before_dir.glob("mega_validation_report*.html"))
          if (before_dir / "report-interactions.js").exists():
              report_names.add("report-interactions.js")

          def normalize(text):
              return re.sub(
                  r"\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} JST",
                  "<generated-at>",
                  text,
              )

          substantive_change = False
          generated_paths = []
          for name in sorted(report_names):
              current = reports_dir / name
              previous = before_dir / name
              if current.exists():
                  generated_paths.append(str(current))
              if not current.exists() and not previous.exists():
                  continue
              if current.exists() != previous.exists():
                  substantive_change = True
                  break
              if normalize(current.read_text(encoding="utf-8")) != normalize(previous.read_text(encoding="utf-8")):
                  substantive_change = True
                  break

          if substantive_change:
              print("Report content changed")
          else:
              subprocess.run(["git", "checkout", "--", *generated_paths], check=False)
              print("Only generated timestamp changed; restored tracked reports")
          PY

      - name: Commit report if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/mega_validation_report_latest.md reports/mega_validation_report*.html reports/report-interactions.js
          if git diff --staged --quiet; then
            echo "Mega validation report is already current"
          else
            git commit -m "chore: update mega validation report [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Install report gate dependencies
        if: ${{ env.REPORT_GATE_DEPLOY_ENABLED == 'true' }}
        working-directory: report-gate
        run: npm ci

      - name: Deploy protected report gate
        if: ${{ env.REPORT_GATE_DEPLOY_ENABLED == 'true' }}
        working-directory: report-gate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy

      - name: Deploy legacy protected report gate URL
        if: ${{ env.REPORT_GATE_DEPLOY_ENABLED == 'true' }}
        working-directory: report-gate
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:legacy
