name: No-TV Tenchi Stage 2 Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/no-tv-distillation
    paths:
      - research/no_tv_stage2_selector.py
      - research/no_tv_v10_standalone.py
      - research/export_full_bottom_history.py
      - .github/workflows/no-tv-stage2-smoke.yml

concurrency:
  group: no-tv-tenchi-stage2-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read

    steps:
      - name: Checkout isolated experiment branch
        uses: actions/checkout@v7
        with:
          ref: experiment/no-tv-distillation
          fetch-depth: 1

      - name: Clone exact public watchlist history
        run: git clone --quiet https://github.com/Ken5InvestmentLab/tv-watchlist-builder.git tv-watchlist-builder-history

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install numpy==2.3.1 pandas==2.3.0 requests==2.32.4 scikit-learn==1.7.2 google-auth google-auth-httplib2 google-api-python-client

      - name: Write read-only Google credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Export full BOTTOM teacher history read-only
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python research/export_full_bottom_history.py \
            --output research_artifacts/no_tv_teacher/full_bottom_history.csv

      - name: Validate teacher
        run: |
          python - <<'PY'
          import pandas as pd
          p='research_artifacts/no_tv_teacher/full_bottom_history.csv'
          df=pd.read_csv(p,dtype={'symbol_code':str})
          print('teacher rows',len(df),'symbols',df.symbol_code.nunique(),'duplicates',df.alert_id.duplicated().sum())
          assert len(df)>=3900
          assert df.alert_id.duplicated().sum()==0
          PY

      - name: Compile Stage 2
        run: python -m py_compile research/no_tv_v10_standalone.py research/no_tv_stage2_selector.py

      - name: Run Stage 2 smoke
        run: |
          python research/no_tv_stage2_selector.py \
            --teacher research_artifacts/no_tv_teacher/full_bottom_history.csv \
            --watchlist-repo tv-watchlist-builder-history \
            --max-symbols 350 \
            --max-workers 20 \
            --output-dir research_artifacts/stage2_smoke

      - name: Upload Stage 2 artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: no-tv-tenchi-stage2-smoke
          path: research_artifacts/stage2_smoke/
          if-no-files-found: ignore
          retention-days: 14
