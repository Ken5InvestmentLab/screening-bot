name: No-TV V10 Live Sheet Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/no-tv-distillation
    paths:
      - research/export_full_bottom_history.py
      - .github/workflows/no-tv-v10-live-sheet-smoke.yml

concurrency:
  group: no-tv-v10-live-sheet-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read

    steps:
      - name: Checkout read-only teacher repo branch
        uses: actions/checkout@v7
        with:
          ref: experiment/no-tv-distillation
          fetch-depth: 1

      - name: Clone V10 experiment and exact watchlist history
        run: |
          git clone --quiet --branch experiment/no-tv-distillation-v10 --single-branch https://github.com/Ken5InvestmentLab/m-shiki-auto-screening.git m-shiki
          git clone --quiet https://github.com/Ken5InvestmentLab/tv-watchlist-builder.git tv-watchlist-builder-history

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: m-shiki/requirements-v3.txt

      - name: Install dependencies
        run: |
          python -m pip install -r m-shiki/requirements-v3.txt
          python -m pip install google-auth google-auth-httplib2 google-api-python-client

      - name: Write read-only Google credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Export full BOTTOM teacher history from production Sheet read-only
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python research/export_full_bottom_history.py \
            --output m-shiki/teacher_live/full_bottom_history.csv

      - name: Validate teacher before model run
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          p=Path('m-shiki/teacher_live/full_bottom_history.csv')
          df=pd.read_csv(p,dtype={'symbol_code':str})
          print(json.dumps({
            'rows':len(df),
            'symbols':int(df.symbol_code.nunique()),
            'date_min':str(df.signal_date.min()),
            'date_max':str(df.signal_date.max()),
            'duplicates':int(df.alert_id.duplicated().sum()),
            'monthly':df.groupby(df.signal_date.astype(str).str[:7]).size().astype(int).to_dict(),
            'sessions':df.session.value_counts().sort_index().astype(int).to_dict(),
          },ensure_ascii=False,indent=2))
          assert len(df)>=3900
          assert df.alert_id.duplicated().sum()==0
          PY

      - name: Run V10 exact-watchlist smoke
        working-directory: m-shiki
        run: |
          python no_tv_v10_full_history.py \
            --teacher teacher_live/full_bottom_history.csv \
            --watchlist-repo ../tv-watchlist-builder-history \
            --max-symbols 350 \
            --max-workers 20 \
            --output-dir reports_no_tv_v10_live

      - name: Upload V10 smoke artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: no-tv-v10-live-sheet-smoke
          path: |
            m-shiki/reports_no_tv_v10_live/
            m-shiki/teacher_live/full_bottom_history.summary.json
          if-no-files-found: ignore
          retention-days: 14
