name: Daily Screener Optimization

on:
  workflow_dispatch:  # 手動実行ボタン（GASのrunDailyMaintenanceから自動起動）

jobs:
  refresh_report_before_optimize:
    uses: ./.github/workflows/mega-validation-report.yml
    permissions:
      contents: write
    secrets: inherit

  optimize:
    needs: refresh_report_before_optimize
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy pandas openpyxl google-auth google-auth-httplib2 google-api-python-client

      - name: Write credentials.json
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Write SSH key
        run: |
          echo '${{ secrets.SSH_PRIVATE_KEY }}' > /tmp/ssh_key
          chmod 600 /tmp/ssh_key

      - name: Propose Mega report scoring logic
        env:
          PYTHONIOENCODING: utf-8
        run: python optimize_screener.py --propose-mega-report-logic-only

      - name: Propose Sniper scoring logic
        env:
          PYTHONIOENCODING: utf-8
        run: python optimize_screener.py --propose-sniper-only

      - name: Run Stable optimizer (sweep + auto-propose best threshold)
        env:
          PYTHONIOENCODING: utf-8
        # 複数の +X% 閾値で並列バックテストし、品質ゲートをクリアした中で
        # 最良（候補★6勝率が最高、同率なら低閾値優先）を自動採用する。
        # 1閾値あたり約60秒、4閾値で約4分。propose実行込みで約5分。
        # どの閾値もゲートを通らなければ pending_logic.json は作成されない。
        run: python optimize_screener.py --win-threshold-sweep "0.05,0.07,0.08,0.10" --propose --yes

      - name: Commit pending logic/state (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f pending_logic.json ] && [ ! -f pending_logic_sniper.json ] && [ ! -f pending_logic_mega.json ] && [ ! -f rescue_state.json ]; then
            echo "No pending logic or optimizer state to commit"
            exit 0
          fi
          [ -f pending_logic.json ] && git add pending_logic.json
          [ -f pending_logic_sniper.json ] && git add pending_logic_sniper.json
          [ -f pending_logic_mega.json ] && git add pending_logic_mega.json
          [ -f rescue_state.json ] && git add rescue_state.json
          if git diff --staged --quiet; then
            echo "No changes staged"
          else
            staged_files="$(git diff --staged --name-only)"
            if echo "$staged_files" | grep -Eq '^(pending_logic|pending_logic_sniper|pending_logic_mega)\.json$'; then
              git commit -m "feat: propose screener logic update [pending approval]"
            else
              git commit -m "chore: update optimizer rescue state [skip ci]"
            fi
            git pull --rebase origin main
            git push
          fi
